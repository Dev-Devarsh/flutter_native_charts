name: Publish to pub.dev

on:
  push:
    tags:
      # Match pub.dev automated publishing tag pattern: v{{version}}
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Used by release.yml after merge to main (GITHUB_TOKEN tag pushes do not
  # chain into this workflow). Must be enabled on pub.dev Admin → Automated
  # publishing → "Enable publishing from workflow_dispatch events".
  workflow_dispatch:

jobs:
  # Re-run the full CI gate (analyze, tests, dry-run, suspicious-code scan)
  # before publishing.
  ci:
    name: Pre-publish CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish package
    needs: ci
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # OIDC for pub.dev trusted publishing
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup pub.dev OIDC credentials
        uses: flutter-actions/setup-pubdev-credentials@v1

      - name: Install dependencies
        run: flutter pub get

      - name: Verify ref is a version tag matching pubspec
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
          echo "pubspec version: $VERSION"
          echo "github.ref: $GITHUB_REF"
          echo "event: ${{ github.event_name }}"

          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Publish must run on a version tag (refs/tags/vX.Y.Z). Got: $GITHUB_REF"
            echo "From release.yml use: gh workflow run publish.yml --ref vX.Y.Z"
            exit 1
          fi

          TAG="${GITHUB_REF_NAME#v}"
          echo "Git tag version: $TAG"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag ($TAG) does not match pubspec.yaml version ($VERSION)"
            exit 1
          fi

      - name: Final publish dry-run
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish --force