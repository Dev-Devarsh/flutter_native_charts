name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install package dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze --fatal-infos

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate package for pub.dev
        run: dart pub publish --dry-run

  # Catches supply-chain / malicious patterns in build scripts and project
  # helpers (Gradle, Podspec, shell, CMake, etc.). Does not build or scan
  # example APK/IPA artifacts.
  suspicious-code-scan:
    name: Suspicious code scan
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for suspicious build / script patterns
        run: |
          set -euo pipefail

          FAILED=0
          warn() { echo "::warning::$1"; }
          fail() { echo "::error::$1"; FAILED=1; }

          collect_files() {
            find . -type f \( "$@" \) \
              ! -path './.git/*' \
              ! -path './.gradle/*' \
              ! -path '*/build/*' \
              ! -path '*/.dart_tool/*' \
              ! -path '*/Pods/*' \
              ! -path './.github/workflows/*' \
              2>/dev/null || true
          }

          scan_pattern() {
            local label="$1"
            local pattern="$2"
            local severity="$3" # fail | warn
            shift 3
            local files
            files=$(printf '%s\n' "$@" | sed '/^$/d')
            if [ -z "$files" ]; then
              return 0
            fi
            # Grep returns 1 when no matches — that is success for us.
            # Drop hits on comment-only lines (# or //) to avoid false positives
            # like Markdown-style backticks in podspec comments.
            if matches=$(printf '%s\n' "$files" | xargs grep -Pn "$pattern" 2>/dev/null \
              | grep -Ev ':[0-9]+:[[:space:]]*(#|//)'); then
              echo ""
              echo "── Matched: $label ──"
              echo "$matches"
              if [ "$severity" = "fail" ]; then
                fail "BLOCKED — $label"
              else
                warn "Review — $label"
              fi
            fi
          }

          echo "═══════════════════════════════════════════════════"
          echo "  Suspicious code scan (source & build scripts)   "
          echo "═══════════════════════════════════════════════════"

          ANDROID_FILES=$(collect_files \
            -name '*.gradle' -o \
            -name '*.gradle.kts' -o \
            -name '*.groovy')

          IOS_FILES=$(collect_files \
            -name 'Podfile' -o \
            -name '*.podspec' -o \
            -name '*.xcconfig' -o \
            -name 'Fastfile' -o \
            -name 'Matchfile' -o \
            -name 'Gymfile' -o \
            -name 'Appfile')

          SCRIPT_FILES=$(collect_files \
            -name '*.sh' -o \
            -name '*.bash' -o \
            -name 'Makefile' -o \
            -name 'Dockerfile' -o \
            -name '*.cmake' -o \
            -name 'CMakeLists.txt')

          echo "Android build files:"
          echo "${ANDROID_FILES:-  (none)}" | sed 's/^/  /'
          echo "iOS build files:"
          echo "${IOS_FILES:-  (none)}" | sed 's/^/  /'
          echo "Scripts / CMake:"
          echo "${SCRIPT_FILES:-  (none)}" | sed 's/^/  /'
          echo ""

          # ── Android / Gradle ───────────────────────────────────────────
          # Arbitrary OS command execution from build scripts (common malware vector).
          scan_pattern \
            "Gradle/Groovy .execute() (arbitrary OS command)" \
            '\.execute\(\s*\)' \
            fail $ANDROID_FILES

          scan_pattern \
            "Runtime.exec / ProcessBuilder in Gradle" \
            'Runtime\s*\.\s*getRuntime\s*\(\s*\)\s*\.\s*exec|new\s+ProcessBuilder' \
            fail $ANDROID_FILES

          scan_pattern \
            "Obfuscated decode chain in Gradle (xxd / base64 -d)" \
            'xxd\b|base64\s+(-d|--decode)' \
            fail $ANDROID_FILES

          # Hex blobs only when paired with decode/exec intent (avoids SHA-256 false positives).
          scan_pattern \
            "Hex payload + decode/exec in Gradle" \
            '([0-9a-fA-F]{64,}.*(xxd|base64|decode|execute|Runtime\.|ProcessBuilder)|(xxd|base64|decode|execute|Runtime\.|ProcessBuilder).*[0-9a-fA-F]{64,})' \
            fail $ANDROID_FILES

          scan_pattern \
            "Remote shell pipe in Gradle (curl|sh / wget|bash)" \
            '(curl|wget)\s[^|]*\|\s*(sh|bash|zsh|ksh)' \
            fail $ANDROID_FILES

          scan_pattern \
            "Network fetch in Gradle (manual review)" \
            '\b(curl|wget|nc|ncat)\s+' \
            warn $ANDROID_FILES

          # ── iOS / CocoaPods / Fastlane ──────────────────────────────────
          # Block obvious malware; allow common Flutter podspec helpers if needed later.
          scan_pattern \
            "Shell execution in iOS build file (system/exec/backtick/%x)" \
            '(\bsystem\s*\(|\bexec\s*\(|`[^`]+`|%x\{)' \
            fail $IOS_FILES

          scan_pattern \
            "eval() in iOS build file" \
            '\beval\s*\(' \
            fail $IOS_FILES

          scan_pattern \
            "Obfuscated decode in iOS build file" \
            'xxd\b|base64\s+(-d|--decode)|Base64\.decode64' \
            fail $IOS_FILES

          scan_pattern \
            "Hex payload + decode/exec in iOS build file" \
            '([0-9a-fA-F]{64,}.*(xxd|base64|decode|system|exec)|(xxd|base64|decode|system|exec).*[0-9a-fA-F]{64,})' \
            fail $IOS_FILES

          scan_pattern \
            "Remote shell pipe in iOS build file" \
            '(curl|wget)\s[^|]*\|\s*(sh|bash|ruby)' \
            fail $IOS_FILES

          # ── Shell / CMake / Docker ──────────────────────────────────────
          scan_pattern \
            "Multi-stage decode chain in project script" \
            'xxd\s+-p\s+-r\s*\|\s*xxd|base64\s+(-d|--decode)\s*\|' \
            fail $SCRIPT_FILES

          scan_pattern \
            "Remote shell pipe in project script" \
            '(curl|wget)\s[^|]*\|\s*(sh|bash|zsh)' \
            fail $SCRIPT_FILES

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "::error::Suspicious code scan FAILED."
            exit 1
          fi

          echo ""
          echo "✅ Suspicious code scan passed."
