name: flutter_native_charts
description: >-
  Lightweight GPU-backed chart for Android/iOS: small Dart surface, ffi + native
  view only — no Canvas, minimal dependencies.
version: 0.0.2
homepage: https://github.com/Dev-Devarsh/flutter_native_charts
repository: https://github.com/Dev-Devarsh/flutter_native_charts
issue_tracker: https://github.com/Dev-Devarsh/flutter_native_charts/issues

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_native_charts
        pluginClass: FlutterNativeChartsPlugin
      ios:
        pluginClass: FlutterNativeChartsPlugin
    ffiPlugin: true
